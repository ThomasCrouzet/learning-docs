<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les niveaux de maturité de Richardson</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: system-ui, 'Segoe UI', sans-serif;
      --font-serif: Georgia, 'Iowan Old Style', serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.25rem, 2vw + 0.75rem, 1.75rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">couches · learning-docs</p>
    <h1>Les niveaux de maturité de Richardson</h1>
    <svg viewBox="0 0 880 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="12-api-design-01-principes-rest-avances-1-title 12-api-design-01-principes-rest-avances-1-desc">
      <title id="12-api-design-01-principes-rest-avances-1-title">Les niveaux de maturité de Richardson</title>
      <desc id="12-api-design-01-principes-rest-avances-1-desc">Quatre niveaux REST empilés : le marais (une URL POST), les ressources, les méthodes HTTP (minimum recommandé), puis HATEOAS.</desc>
      <defs>
        <marker id="12-api-design-01-principes-rest-avances-1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="12-api-design-01-principes-rest-avances-1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="12-api-design-01-principes-rest-avances-1-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="48" y="56" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">MATURITÉ</text>
      <line x1="72" y1="72" x2="72" y2="360" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <polygon points="68,72 76,72 72,64" fill="#4f5d75"/>
      <text x="48" y="380" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">MARAIS</text>

      <line x1="104" y1="72" x2="832" y2="72" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="104" y1="360" x2="832" y2="360" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <rect x="104" y="72" width="728" height="72" fill="#ffffff"/>
      <line x1="104" y1="144" x2="832" y2="144" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="124" y="112" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">N3</text>
      <text x="200" y="116" fill="#2d3142" font-size="16" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif">HATEOAS</text>
      <text x="808" y="116" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">liens dans les réponses</text>

      <rect x="104" y="144" width="728" height="72" fill="rgba(235,108,54,0.08)"/>
      <rect x="104" y="144" width="728" height="72" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <text x="124" y="184" fill="#eb6c36" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">N2</text>
      <text x="200" y="188" fill="#2d3142" font-size="16" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif">Méthodes HTTP</text>
      <text x="808" y="188" fill="#eb6c36" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">GET · POST · PUT · DELETE</text>

      <rect x="104" y="216" width="728" height="72" fill="#f5f5f5"/>
      <line x1="104" y1="288" x2="832" y2="288" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="124" y="256" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">N1</text>
      <text x="200" y="260" fill="#2d3142" font-size="16" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif">Ressources</text>
      <text x="808" y="260" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">URL distinctes · POST /articles</text>

      <rect x="104" y="288" width="728" height="72" fill="#ececec"/>
      <text x="124" y="328" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">N0</text>
      <text x="200" y="332" fill="#2d3142" font-size="16" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif">Le marais</text>
      <text x="808" y="332" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">une URL, POST uniquement</text>

      <line x1="32" y1="412" x2="848" y2="412" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="432" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LÉGENDE</text>
      <rect x="112" y="424" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="136" y="434" fill="#4f5d75" font-size="12" font-family="system-ui, 'Segoe UI', sans-serif">Niveau 2 : minimum recommandé en production</text>
    </svg>
  </div>
</body>
</html>
