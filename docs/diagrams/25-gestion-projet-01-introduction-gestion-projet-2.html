<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Qu&#x27;est-ce que le triangle qualité/coût/délai ?</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: system-ui, 'Segoe UI', sans-serif;
      --font-serif: Georgia, 'Iowan Old Style', serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.25rem, 2vw + 0.75rem, 1.75rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">loop · Diagram Design</p>
    <h1>Qu&#x27;est-ce que le triangle qualité/coût/délai ?</h1>
    <svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="25-gestion-projet-01-introduction-gestion-projet-2-title 25-gestion-projet-01-introduction-gestion-projet-2-desc">
      <title id="25-gestion-projet-01-introduction-gestion-projet-2-title">Qu&#x27;est-ce que le triangle qualité/coût/délai ?</title>
      <desc id="25-gestion-projet-01-introduction-gestion-projet-2-desc">Triangle projet : qualité, coût et délai sont liés. Tirer un sommet déplace les deux autres.</desc>
      <defs>
        <marker id="25-gestion-projet-01-introduction-gestion-projet-2-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="25-gestion-projet-01-introduction-gestion-projet-2-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="25-gestion-projet-01-introduction-gestion-projet-2-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <path d="M 320 132 L 200 236" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 320 132 L 440 236" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 200 236 L 440 236" fill="none" stroke="#eb6c36" stroke-width="1.2"/>

      <rect x="240" y="32" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="32" width="160" height="52" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="320" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Qualité</text>

      <rect x="80" y="236" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="236" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Coût</text>

      <rect x="400" y="236" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="236" width="160" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Délai</text>

      <text x="320" y="188" fill="#4f5d75" font-size="8" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">un sommet bouge, les deux autres suivent</text>

      <line x1="32" y1="356" x2="608" y2="356" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="376" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
      <text x="104" y="376" fill="#4f5d75" font-size="8" font-family="system-ui, 'Segoe UI', sans-serif">plus vite + moins cher = moins de qualité, sauf arbitrage explicite</text>
    </svg>
  </div>
