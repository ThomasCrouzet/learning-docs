<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les 4 couches de Clean Architecture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: system-ui, 'Segoe UI', sans-serif;
      --font-serif: Georgia, 'Iowan Old Style', serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.25rem, 2vw + 0.75rem, 1.75rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">couches · autism-hero</p>
    <h1>Les 4 couches de Clean Architecture</h1>
    <svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="10-architecture-08-clean-architecture-1-title 10-architecture-08-clean-architecture-1-desc">
      <title id="10-architecture-08-clean-architecture-1-title">Les 4 couches de Clean Architecture</title>
      <desc id="10-architecture-08-clean-architecture-1-desc">Quatre anneaux concentriques : Frameworks &amp; Drivers autour des adapters, des use cases, puis des entités au centre. Les dépendances pointent toujours vers l'intérieur.</desc>
      <defs>
        <marker id="10-architecture-08-clean-architecture-1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="10-architecture-08-clean-architecture-1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="10-architecture-08-clean-architecture-1-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <rect x="40" y="32" width="720" height="260" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="72" y="68" width="656" height="192" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <rect x="104" y="104" width="592" height="124" rx="8" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="216" y="140" width="368" height="56" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>

      <rect x="56" y="24" width="216" height="16" fill="#f5f5f5"/>
      <text x="64" y="36" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">L4 · FRAMEWORKS &amp; DRIVERS</text>
      <text x="720" y="56" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">Symfony · Doctrine · Twig · HTTP</text>

      <rect x="88" y="60" width="176" height="16" fill="#f5f5f5"/>
      <text x="96" y="72" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">L3 · INTERFACE ADAPTERS</text>
      <text x="696" y="92" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">contrôleurs · presenters · repos</text>

      <rect x="120" y="96" width="112" height="16" fill="#f5f5f5"/>
      <text x="128" y="108" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.12em">L2 · USE CASES</text>
      <text x="664" y="128" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">services applicatifs</text>

      <text x="400" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Entities</text>
      <text x="400" y="180" fill="#eb6c36" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">L1 · logique métier</text>

      <line x1="32" y1="316" x2="768" y2="316" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="336" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LÉGENDE</text>
      <text x="112" y="336" fill="#4f5d75" font-size="12" font-family="system-ui, 'Segoe UI', sans-serif">Les dépendances pointent toujours vers le centre. Le cœur ne connaît pas l'extérieur.</text>
    </svg>
  </div>
</body>
</html>
