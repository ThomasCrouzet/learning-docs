<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cycle de vie d'un conteneur Docker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: system-ui, 'Segoe UI', sans-serif;
      --font-serif: Georgia, 'Iowan Old Style', serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.25rem, 2vw + 0.75rem, 1.75rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">états · learning-docs</p>
    <h1>Cycle de vie d'un conteneur Docker</h1>
    <svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-docker-02-lancement-projet-git-1-title 01-docker-02-lancement-projet-git-1-desc">
      <title id="01-docker-02-lancement-projet-git-1-title">Cycle de vie d'un conteneur Docker</title>
      <desc id="01-docker-02-lancement-projet-git-1-desc">États d'un conteneur : absent, en cours, arrêté, puis supprimé. Les commandes compose up, stop, start et down font passer d'un état à l'autre.</desc>
      <defs>
        <marker id="01-docker-02-lancement-projet-git-1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="01-docker-02-lancement-projet-git-1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="01-docker-02-lancement-projet-git-1-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <line x1="52" y1="156" x2="72" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-docker-02-lancement-projet-git-1-arrow)"/>
      <line x1="232" y1="156" x2="304" y2="156" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#01-docker-02-lancement-projet-git-1-arrow-accent)"/>
      <rect x="236" y="136" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="268" y="146" fill="#eb6c36" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">COMPOSE UP</text>

      <line x1="480" y1="156" x2="552" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-docker-02-lancement-projet-git-1-arrow)"/>
      <rect x="484" y="136" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="146" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">COMPOSE STOP</text>

      <path d="M 632 128 V 104 Q 632 96 624 96 H 400 Q 392 96 392 104 V 128" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#01-docker-02-lancement-projet-git-1-arrow)"/>
      <rect x="472" y="76" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="86" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">COMPOSE START</text>

      <line x1="712" y1="156" x2="784" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-docker-02-lancement-projet-git-1-arrow)"/>
      <rect x="716" y="136" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="752" y="146" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">COMPOSE DOWN</text>

      <line x1="944" y1="156" x2="968" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#01-docker-02-lancement-projet-git-1-arrow)"/>

      <circle cx="40" cy="156" r="6" fill="#2d3142"/>

      <rect x="72" y="128" width="160" height="56" rx="8" fill="#f5f5f5"/>
      <rect x="72" y="128" width="160" height="56" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="152" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Absent</text>
      <text x="152" y="168" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">non créé</text>

      <rect x="304" y="128" width="176" height="56" rx="8" fill="#f5f5f5"/>
      <rect x="304" y="128" width="176" height="56" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="392" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">En cours</text>
      <text x="392" y="168" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">moteur allumé</text>

      <rect x="552" y="128" width="160" height="56" rx="8" fill="#f5f5f5"/>
      <rect x="552" y="128" width="160" height="56" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="632" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Arrêté</text>
      <text x="632" y="168" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">conteneur conservé</text>

      <rect x="784" y="128" width="160" height="56" rx="8" fill="#f5f5f5"/>
      <rect x="784" y="128" width="160" height="56" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="864" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Supprimé</text>
      <text x="864" y="168" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">plus de conteneur</text>

      <circle cx="980" cy="156" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="980" cy="156" r="4" fill="#2d3142"/>

      <line x1="32" y1="260" x2="968" y2="260" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="280" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LÉGENDE</text>
      <rect x="112" y="272" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="136" y="282" fill="#4f5d75" font-size="12" font-family="system-ui, 'Segoe UI', sans-serif">État actif</text>
      <line x1="248" y1="278" x2="280" y2="278" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="288" y="282" fill="#4f5d75" font-size="12" font-family="system-ui, 'Segoe UI', sans-serif">Redémarrage</text>
    </svg>
  </div>
</body>
</html>
