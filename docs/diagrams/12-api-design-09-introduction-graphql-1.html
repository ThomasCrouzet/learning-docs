<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qu'est-ce que GraphQL ?</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #eb6c36;
      --font-sans: system-ui, 'Segoe UI', sans-serif;
      --font-serif: Georgia, 'Iowan Old Style', serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.25rem, 2vw + 0.75rem, 1.75rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">architecture · learning-docs</p>
    <h1>Qu'est-ce que GraphQL ?</h1>
    <svg viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="12-api-design-09-introduction-graphql-1-title 12-api-design-09-introduction-graphql-1-desc">
      <title id="12-api-design-09-introduction-graphql-1-title">Qu'est-ce que GraphQL ?</title>
      <desc id="12-api-design-09-introduction-graphql-1-desc">REST exige trois requêtes pour un utilisateur, ses posts et ses commentaires. GraphQL récupère le même graphe en une seule requête vers /graphql.</desc>
      <defs>
        <marker id="12-api-design-09-introduction-graphql-1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="12-api-design-09-introduction-graphql-1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="12-api-design-09-introduction-graphql-1-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <rect x="32" y="32" width="400" height="288" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="36" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="52" y="46" fill="rgba(45,49,66,0.40)" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">REST · 3 REQUÊTES</text>

      <rect x="448" y="32" width="400" height="288" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="464" y="36" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="46" fill="rgba(45,49,66,0.40)" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">GRAPHQL · 1 REQUÊTE</text>

      <line x1="216" y1="104" x2="256" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#12-api-design-09-introduction-graphql-1-arrow)"/>
      <line x1="216" y1="188" x2="256" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#12-api-design-09-introduction-graphql-1-arrow)"/>
      <line x1="216" y1="260" x2="256" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#12-api-design-09-introduction-graphql-1-arrow)"/>
      <line x1="580" y1="128" x2="580" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#12-api-design-09-introduction-graphql-1-arrow)"/>
      <line x1="680" y1="196" x2="704" y2="196" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#12-api-design-09-introduction-graphql-1-arrow-accent)"/>

      <rect x="48" y="80" width="168" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="80" width="168" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="132" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">GET /users/1</text>
      <text x="132" y="116" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">utilisateur</text>

      <rect x="48" y="164" width="168" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="164" width="168" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="132" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">GET /users/1/posts</text>
      <text x="132" y="200" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">articles</text>

      <rect x="48" y="236" width="168" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="236" width="168" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="132" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">GET /posts/5/comments</text>
      <text x="132" y="272" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">commentaires</text>

      <rect x="256" y="80" width="152" height="204" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="80" width="152" height="204" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="332" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Serveur REST</text>
      <text x="332" y="196" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">3 allers-retours</text>

      <rect x="480" y="80" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="80" width="200" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="580" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Client</text>
      <text x="580" y="116" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">une query</text>

      <rect x="480" y="160" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="160" width="200" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="580" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">query {</text>
      <text x="580" y="200" fill="#2d3142" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">user { posts { comments } }</text>
      <text x="580" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">}</text>

      <rect x="704" y="172" width="120" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="704" y="172" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="764" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">Serveur</text>
      <text x="764" y="208" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">/graphql</text>

      <line x1="32" y1="348" x2="848" y2="348" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="368" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">LÉGENDE</text>
      <text x="112" y="368" fill="#4f5d75" font-size="12" font-family="system-ui, 'Segoe UI', sans-serif">REST multiplie les allers-retours. GraphQL assemble le graphe en une query.</text>
    </svg>
  </div>
</body>
</html>
