# Configuration gitleaks pour learning-docs.
#
# Les extraits pédagogiques dans docs/ peuvent ressembler à des secrets
# (clés d'exemple, PEM de démo). On ne masque plus tout le corpus Markdown :
# seuls les motifs explicitement factices et les rapports d'audit locaux
# sont en allowlist. Un secret réel dans une fiche doit faire échouer le scan.

[extend]
useDefault = true

[allowlist]
description = "Placeholders pédagogiques clairement factices et rapports d'audit locaux"
paths = [
  '''audit-reports/.*''',
]
regexes = [
  '''(?i)(exemple|example[-_ ]?(key|secret|token)|changeme|placeholder|dummy[-_]?secret|your[-_]?api[-_]?key|votre[_-]?cle|AKIAIOSFODNN7EXAMPLE)''',
]
