services:
  mkdocs:
    image: squidfunk/mkdocs-material:9.7.7
    ports:
      - "8100:8000"
    volumes:
      - .:/docs
    command: serve --dev-addr=0.0.0.0:8000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read(1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
