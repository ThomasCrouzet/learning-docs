site_name: Learning Docs
site_url: !ENV [MKDOCS_SITE_URL, '']
site_description: >-
  Fiches de cours structurées et explicites pour l'apprentissage
  en autonomie (développement, infrastructure, DevOps et domaines associés)
copyright: "CC BY 4.0 - Thomas Crouzet"
docs_dir: docs
exclude_docs: |
  includes/
  ansible/01-ansible/index.md
  a-propos.md
  politique-fraicheur.md
  accessibility-audit.md
  tags.md

theme:
  name: material
  custom_dir: docs/overrides
  language: fr
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Mode clair
  font:
    text: Lexend
    code: Atkinson Hyperlegible Mono
  icon:
    logo: material/book-open-variant
    tag:
      docker: simple/docker
      php: simple/php
      symfony: simple/symfony
      postgresql: simple/postgresql
      javascript: simple/javascript
      java: fontawesome/brands/java
      rust: simple/rust
      git: simple/git
      linux: simple/linux
      html: fontawesome/brands/html5
      css: fontawesome/brands/css3
      nodejs: simple/nodedotjs
      ansible: simple/ansible
      podman: simple/podman
      redhat: simple/redhat
      kubernetes: simple/kubernetes
      redis: simple/redis
      graphql: simple/graphql
      typescript: simple/typescript
      react: simple/react
      testing: material/test-tube
      architecture: material/floor-plan
      cicd: material/pipe
      api: material/api
      monitoring: material/chart-line
      cybersecurite: material/shield-lock
      ia: material/brain
      faust: material/music-note
      crypto: material/currency-btc
      python: simple/python
      mongodb: simple/mongodb
      csharp: material/language-csharp
      c: material/language-c
      reseaux: material/router-network
      systemes: material/server
      mobile: material/cellphone
      virtualisation: material/desktop-classic
      data: material/chart-bar
      droit: material/gavel
      ux: material/palette
      concept: material/book-open-variant
      pratique: material/hammer-wrench
      reference: material/bookmark-outline
  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - navigation.top
    # Recherche
    - search.suggest
    - search.highlight
    - search.share
    # Contenu
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    # TOC
    - toc.follow

plugins:
  - search:
      lang: fr
      separator: '[\s\-\.]+'
  - tags:
      tags_sort_by: !!python/name:material.plugins.tags.tag_name_casefold
      tags_allowed:
        - Docker
        - PHP
        - Symfony
        - EasyAdmin
        - PostgreSQL
        - JavaScript
        - Java
        - Rust
        - Git
        - HTML/CSS
        - Unix/Bash
        - Node.js
        - Podman
        - OpenShift
        - Ansible
        - TypeScript
        - React
        - Testing
        - Architecture
        - CI/CD
        - API
        - Redis
        - Monitoring
        - GraphQL
        - Kubernetes
        - Cloud
        - Cybersécurité
        - IA
        - Faust
        - Crypto-monnaies
        - Outils IA
        - Python
        - Data
        - MongoDB
        - C#
        - C
        - Réseaux
        - Systèmes
        - Mobile
        - Virtualisation
        - Droit
        - UX
        - Débutant
        - Intermédiaire
        - Avancé
        - Expert
        - Concept
        - Pratique
        - Référence
        - Projet
        - PHPUnit
        - Doctrine
        - Workflow
        - Sécurité
        - DDD
        - Audit
        - Qualité
        - Méthodologie
        - Stratégie
        - Communication
        - Code review

  - minify:
      # minify_html DESACTIVE : il collapse les retours a la ligne a
      # l'interieur des <div class="mermaid-source">, ce qui aplatit les
      # diagrammes Mermaid multi-lignes sur une seule ligne et casse leur
      # parsing cote client ("Syntax error in text"). Un <div> n'est pas
      # protege du collapse de whitespace comme l'est un <pre>.
      # minify_js/minify_css restent desactives (KaTeX, Mermaid, recherche).
      minify_html: false

  - privacy:
      assets_exclude:
        - unpkg.com/mermaid*

markdown_extensions:
  # Python Markdown
  - tables
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Lien permanent
      toc_depth: 3
  # PyMdown Extensions
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-source
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - includes/glossary.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.mark
  - pymdownx.keys

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/katex-loader.js
  - javascripts/mermaid-v2.js
  - javascripts/extra.js

