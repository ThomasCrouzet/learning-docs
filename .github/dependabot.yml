version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    # Ces dépendances sont aussi publiées sous forme de fichiers statiques dans docs/.
    # Leurs mises à jour de version restent manuelles pour synchroniser les assets.
    # Les mises à jour de sécurité restent autorisées par Dependabot.
    ignore:
      - dependency-name: katex
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: mermaid
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      npm-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 2
