name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "curriculum/**"
      - "mkdocs.yml"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".markdownlint.json"
      - ".markdownlintignore"
      - "LICENSE"
      - "LICENSE-CODE"
      - "NOTICE"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - ".github/workflows/**"
      - "AGENTS.md"
      - ".husky/**"
      - "e2e/**"
      - ".gitleaks.toml"
      - "vitest.config.js"
      - "playwright.config.js"
      - "review-evidence/**"
  pull_request:
    paths:
      - "docs/**"
      - "curriculum/**"
      - "mkdocs.yml"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".markdownlint.json"
      - ".markdownlintignore"
      - "LICENSE"
      - "LICENSE-CODE"
      - "NOTICE"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - ".github/workflows/**"
      - "AGENTS.md"
      - ".husky/**"
      - "e2e/**"
      - ".gitleaks.toml"
      - "vitest.config.js"
      - "playwright.config.js"
      - "review-evidence/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Lint and corpus gates
        run: npm run lint:ci

  build:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt

      - name: Check Python dependencies
        run: python -m pip check

      - name: MkDocs build (strict)
        run: mkdocs build --strict
        env:
          MKDOCS_SITE_URL: https://thomascrouzet.github.io/learning-docs/
          NO_MKDOCS_2_WARNING: "true"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node.js dependencies (build-meta)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Emit site/build-meta.json
        run: node scripts/generate-build-meta.js
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  orientation-e2e:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt
          npx playwright install --with-deps chromium

      - name: Construire le site strictement
        run: mkdocs build --strict
        env:
          MKDOCS_SITE_URL: https://thomascrouzet.github.io/learning-docs/
          NO_MKDOCS_2_WARNING: "true"

      - name: Tester l’orientation sur le build de production
        run: |
          python -m http.server 4173 --directory site >/tmp/learning-docs-e2e.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/parcours/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/parcours/ >/dev/null
          npx playwright test e2e/orientation-v2.spec.js

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: [build, orientation-e2e]
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
