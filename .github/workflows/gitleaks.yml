name: gitleaks

# Secret scan on full git history. Pedagogical fake secrets in docs/**/*.md
# are allowlisted in .gitleaks.toml (see file comments).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (pinned binary v8.30.1)
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            -fsSLo "${RUNNER_TEMP}/${ARCHIVE}" "${BASE_URL}/${ARCHIVE}"
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            -fsSLo "${RUNNER_TEMP}/checksums.txt" \
            "${BASE_URL}/gitleaks_${VERSION}_checksums.txt"
          (
            cd "${RUNNER_TEMP}"
            grep " ${ARCHIVE}$" checksums.txt | sha256sum --check
          )
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
          "${RUNNER_TEMP}/gitleaks" git "${GITHUB_WORKSPACE}" \
            --config "${GITHUB_WORKSPACE}/.gitleaks.toml" \
            --no-banner \
            --redact \
            --exit-code 1
